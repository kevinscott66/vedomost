name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests cloud/worker.py cloud/domain.py cloud/build_assets.py
      - run: python -m ruff format --check app tests cloud/worker.py cloud/domain.py cloud/build_assets.py
      - run: python -m pytest -q
      - run: for file in app/static/*.js cloud/*.js; do node --check "$file"; done
      - run: node --test tests/*.test.cjs
