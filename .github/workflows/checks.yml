name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m ruff check app tests cloud/worker.py cloud/domain.py cloud/build_assets.py
      - run: python -m ruff format --check app tests cloud/worker.py cloud/domain.py cloud/build_assets.py
      - run: python -m pytest -q
      - run: for file in app/static/*.js cloud/*.js; do node --check "$file"; done
      - run: node --test tests/*.test.cjs
