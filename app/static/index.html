<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ведомость — оплаты учебного центра</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/identity.css" />
    <script src="/static/theme.js"></script>
    <script src="/static/presentation.js" defer></script>
    <script src="/static/translations.js" defer></script>
    <script src="/static/i18n.js" defer></script>
    <script src="/static/currency.js" defer></script>
    <script src="/static/calendar.js" defer></script>
    <script src="/static/app.js" defer></script>
  </head>
  <body class="dashboard-page">
    <aside class="sidebar">
      <a
        class="brand"
        href="/"
        aria-label="Ведомость, главная"
        data-i18n-aria="home"
        ><span data-i18n="brand">ведомость</span
        ><span class="brand-dot">.</span></a
      >
      <nav class="tabs" aria-label="Разделы" data-i18n-aria="sections">
        <button id="debts-tab" aria-pressed="true">
          <img src="/static/icons/receipt-text.svg" alt="" /><span
            data-i18n="debtors"
            >Задолженность</span
          ></button
        ><button id="students-tab" aria-pressed="false">
          <img src="/static/icons/users.svg" alt="" /><span data-i18n="students"
            >Ученики</span
          ><span id="student-count">0</span>
        </button>
      </nav>
      <div class="sidebar-bottom">
        <div class="display-settings">
          <label class="language-control select-control"
            ><span class="sr-only" data-i18n="language">Язык</span
            ><select id="language">
              <option value="ru">Русский</option>
              <option value="uz">O‘zbekcha</option>
              <option value="en">English</option>
            </select></label
          >
          <label class="currency-control select-control"
            ><span class="sr-only" data-i18n="displayCurrency"
              >Валюта отображения</span
            ><select id="currency">
              <option value="UZS">UZS · so‘m</option>
              <option value="RUB">RUB · ₽</option>
              <option value="USD">USD · $</option>
            </select></label
          >
        </div>
        <button id="new-student">
          <img src="/static/icons/circle-plus.svg" alt="" /><span
            data-i18n="addStudent"
            >Добавить ученика</span
          ></button
        ><button
          id="theme-toggle"
          aria-label="Включить светлую тему"
          data-i18n-aria="enableLight"
        >
          <img id="theme-icon" src="/static/icons/sun.svg" alt="" /><span
            id="theme-label"
            >Светлая тема</span
          >
        </button>
      </div>
    </aside>
    <main>
      <header class="page-header">
        <div class="welcome-art" data-parallax aria-hidden="true"><img src="/static/media/receipt-study.webp" width="1448" height="1086" alt="" fetchpriority="high" /></div>
        <p class="context"><span data-i18n="context">Учебный центр</span></p>
        <div class="heading-row">
          <h1 id="page-title"><span data-i18n="paymentsHeading">Оплаты учебного центра</span></h1>
          <div class="period">
            <button
              id="previous-month"
              aria-label="Предыдущий месяц"
              data-i18n-aria="previousMonth"
            >
              <img src="/static/icons/chevron-left.svg" alt="" /></button
            ><label class="month-label"
              ><span class="sr-only"
                ><span data-i18n="month">Расчётный месяц</span></span
              ><span id="month-display" class="month-display"></span
              ><input
                id="month"
                type="month"
                required
                min="0001-01"
                max="9999-12" /></label
            ><button
              id="next-month"
              aria-label="Следующий месяц"
              data-i18n-aria="nextMonth"
            >
              <img src="/static/icons/chevron-right.svg" alt="" />
            </button>
          </div>
        </div>
        <p class="welcome-description" data-i18n="welcomeDescription">Ученики, платежи и остаток за месяц.</p>
      </header>
      <div id="global-error" role="alert" hidden></div>
      <section id="debts-view">
        <div class="summary">
          <div class="summary-caption">
            <span><span data-i18n="debtors">Задолженность</span></span
            ><span aria-hidden="true">·</span
            ><span
              ><span id="debt-count">—</span>
              <span id="debt-count-label"
                ><span data-i18n="studentMany">учеников</span></span
              ></span
            >
          </div>
          <div
            id="total"
            class="total"
            aria-label="Общая задолженность"
            data-i18n-aria="totalDebt"
          >
            —
          </div>
          <details class="currency-note" id="currency-details" hidden>
            <summary id="currency-summary">Курсы</summary>
            <p id="currency-note"></p>
          </details>
        </div>
        <div class="workspace">
          <section
            class="ledger"
            aria-label="Список должников"
            data-i18n-aria="debtorList"
          >
            <div id="debt-list" aria-live="polite"></div>
            <p class="footnote" data-i18n="monthNote"></p>
          </section>
          <aside class="payment-panel">
            <h2><span data-i18n="addPayment">Добавить оплату</span></h2>
            <form id="payment-form">
              <label
                ><span data-i18n="student">Ученик</span
                ><select id="pay-student" required>
                  <option value="">
                    <span data-i18n="chooseStudent">Выберите ученика</span>
                  </option>
                </select></label
              ><label
                ><span data-i18n="amount">Сумма</span
                ><input
                  id="pay-amount"
                  type="number"
                  inputmode="decimal"
                  min="0.01"
                  max="9999999999.99"
                  step="0.01"
                  placeholder="Введите сумму"
                  data-i18n-placeholder="amountPlaceholder"
                  required /></label
              ><label
                ><span data-i18n="paymentCurrency">Валюта оплаты</span
                ><select id="pay-currency" required>
                  <option value="UZS">UZS · so‘m</option>
                  <option value="RUB">RUB · ₽</option>
                  <option value="USD">USD · $</option>
                </select></label
              ><label
                ><span data-i18n="date">Дата</span
                ><input id="pay-date" type="date" required
              /></label>
              <p id="payment-message" role="status" class="form-message"></p>
              <button id="save-payment" class="primary">
                <span data-i18n="save">Сохранить</span>
              </button>
            </form>
          </aside>
        </div>
      </section>
      <section id="students-view" hidden>
        <div class="section-head">
          <h2><span data-i18n="studentsCentre">Ученики центра</span></h2>
          <span class="small"
            ><span data-i18n="currentFee">Текущий месячный тариф</span></span
          >
        </div>
        <div id="students-list"></div>
      </section>
      <footer>
        <span data-i18n="copyright"></span>
        <nav
          class="footer-links"
          aria-label="Документы"
          data-i18n-aria="documents"
        >
          <a href="/case" data-i18n="caseLink">О проекте</a>
          <a href="/privacy" data-i18n="privacy"></a>
          <a href="/terms" data-i18n="terms"></a>
          <a href="/rights" data-i18n="rights"></a>
        </nav>
      </footer>
    </main>
    <dialog id="student-dialog" aria-labelledby="student-title">
      <form id="student-form">
        <div class="dialog-head">
          <h2 id="student-title">
            <span data-i18n="newStudent">Новый ученик</span>
          </h2>
          <button
            type="button"
            class="icon"
            id="close-student"
            aria-label="Закрыть"
            data-i18n-aria="close"
          >
            ×
          </button>
        </div>
        <input id="student-id" type="hidden" /><label
          ><span data-i18n="name">Имя</span
          ><input
            id="student-name"
            required
            maxlength="160"
            autocomplete="name" /></label
        ><label
          ><span data-i18n="phone">Телефон</span
          ><input
            id="student-phone"
            type="tel"
            required
            minlength="3"
            maxlength="40"
            autocomplete="tel" /></label
        ><label
          ><span data-i18n="group">Группа</span
          ><input
            id="student-group"
            required
            maxlength="160"
            placeholder="Например, Английский А2"
            data-i18n-placeholder="groupPlaceholder" /></label
        ><label
          ><span data-i18n="monthlyFee">Оплата за месяц</span
          ><input
            id="student-fee"
            type="number"
            inputmode="decimal"
            min="0"
            max="9999999999.99"
            step="0.01"
            required
        /></label>
        <label
          ><span data-i18n="startMonth">Начало обучения</span
          ><input
            id="student-start"
            type="month"
            min="0001-01"
            max="9999-12"
            required
        /></label>
        <p class="muted" data-i18n="startMonthNote"></p>
        <p id="student-message" role="status" class="form-message"></p>
        <button id="save-student" class="primary">
          <span data-i18n="saveStudent">Сохранить ученика</span>
        </button>
      </form>
    </dialog>
    <dialog id="statement-dialog" aria-labelledby="statement-title">
      <div class="dialog-head">
        <h2 id="statement-title">Расчёт задолженности</h2>
        <button type="button" class="icon" id="close-statement" data-i18n-aria="close" aria-label="Закрыть">×</button>
      </div>
      <div id="statement-list" aria-live="polite"></div>
    </dialog>
    <dialog id="history-dialog" aria-labelledby="history-title">
      <div class="dialog-head">
        <h2 id="history-title">
          <span data-i18n="history">История оплат</span>
        </h2>
        <button class="icon" id="close-history" aria-label="Закрыть историю" data-i18n-aria="close">
          ×
        </button>
      </div>
      <div id="history-list"></div>
    </dialog>
    <dialog id="delete-dialog" aria-labelledby="delete-title">
      <h2 id="delete-title"><span data-i18n="deleteStudent">Удалить ученика?</span></h2>
      <p id="delete-description"></p>
      <p class="muted" data-i18n="deleteWarning"></p>
      <p id="delete-message" role="status"></p>
      <div class="dialog-actions">
        <button id="cancel-delete" class="outline">
          <span data-i18n="cancel">Отмена</span></button
        ><button id="confirm-delete" class="danger">
          <span data-i18n="delete">Удалить</span>
        </button>
      </div>
    </dialog>
  </body>
</html>
